name: release-packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-13
            target: macos-x86_64
          - os: macos-14
            target: macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1 -TargetName "${{ matrix.target }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: csu-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip *.tar.gz > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release-assets/*.zip \
              release-assets/*.tar.gz \
              release-assets/checksums.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release-assets/*.zip \
              release-assets/*.tar.gz \
              release-assets/checksums.txt \
              --title "CSU ${GITHUB_REF_NAME}" \
              --notes "CSU ${GITHUB_REF_NAME} provides plug-and-play packages for Windows, Linux, and macOS."
          fi
