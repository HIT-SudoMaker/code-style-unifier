[package]
name = "metacraft_authority"
version = "0.0.0"
edition = "2021"
description = "MetaCraft workspace and authority core"

[lib]
name = "_authority"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
pyo3 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = { package = "serde_json_canonicalizer", version = "0.3.2" }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
