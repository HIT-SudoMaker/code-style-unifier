[release]
display_name = "ChromatixNext"
distribution_name = "chromatix-next"
version = "0.0.0"

[release.compatibility]
python_series = "3.12"
pytorch_series = "2.12"
workstation_platforms = ["windows"]
# ADR-0005: 固定双精度核（float64 实 / complex128 复），无精度选择项。
floating_dtype_policy = "fixed_double"
windows_multi_gpu = false
