[[claims]]
name = "michelson_relative_phase_response"
subject_anchors = [
  { kind = "owner", coordinate = "cube" },
  { kind = "encounter", coordinate = "outward_cube" },
  { kind = "encounter", coordinate = "return_cube" },
  { kind = "produced_value", coordinate = "component=right_back:port=-:direction=output" },
  { kind = "produced_value", coordinate = "component=top_back:port=-:direction=output" },
  { kind = "detection_law", coordinate = "left_detector" },
]
observable_name = "left_intensity"

[claims.acceptance]
metric = "relative_port_ratio"
relation = "absolute_error_at_most"
expected = 0.25
tolerance = 2.0e-12
normalization = "relative_dimensionless"

[[claims.challenge_witnesses]]
name = "phase_omission_counterfactual"
kind = "counterfactual"
targeted_anchors = [
  { kind = "produced_value", coordinate = "component=top_back:port=-:direction=output" },
  { kind = "encounter", coordinate = "return_cube" },
  { kind = "detection_law", coordinate = "left_detector" },
]
supported_baseline_point = "relative_phase_pi_over_three"
challenge_action = "omit_relative_phase"
required_observable_name = "left_intensity"
expected_relation = "nonzero_separation"
finite_tolerance = 2.0e-12
stable_failure_identity = "example_claim_witness_nondiscriminating"
oracle_node_id = "tests/qualification/test_static_claim_evidence.py::test_phase_omission_witness_is_nonzero"
expected_discrimination = 0.20

[[claims.challenge_witnesses]]
name = "analytic_port_ratio_metamorphic"
kind = "metamorphic"
targeted_anchors = [
  { kind = "owner", coordinate = "cube" },
  { kind = "encounter", coordinate = "outward_cube" },
  { kind = "encounter", coordinate = "return_cube" },
  { kind = "produced_value", coordinate = "component=right_back:port=-:direction=output" },
  { kind = "produced_value", coordinate = "component=top_back:port=-:direction=output" },
  { kind = "detection_law", coordinate = "left_detector" },
]
supported_baseline_point = "relative_phase_pi_over_three"
challenge_action = "split_then_add_intensity_wrong_model"
required_observable_name = "left_intensity"
expected_relation = "metamorphic_equality"
finite_tolerance = 2.0e-12
stable_failure_identity = "example_claim_witness_nondiscriminating"
oracle_node_id = "tests/qualification/test_static_claim_evidence.py::test_metamorphic_port_ratio_rejects_wrong_model"
expected_discrimination = 0.20
