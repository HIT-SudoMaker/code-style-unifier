[package]
name = "code-style-unifier"
version = "3.0.1"
edition = "2024"
license = "MIT"
description = "High-performance semantic code style unification across Python, Rust, C, and C++ for next-generation scientific software engineering"
repository = "https://github.com/HIT-SudoMaker/code-style-unifier"
readme = "README.md"

[lib]
name = "csu"
path = "src/lib.rs"

[[bin]]
name = "csu"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tree-sitter = "0.26.13"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp.git", rev = "8b5b49eb196bec7040441bee33b2c9a4838d6967" }
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1

[[test]]
name = "terminal_contract"
path = "tests/review/terminal_contract.rs"

[[test]]
name = "fixture_contract"
path = "tests/review/fixture_contract.rs"

[[test]]
name = "projection_cli"
path = "tests/review/projection_cli.rs"

[[test]]
name = "identifier_subjects"
path = "tests/identifier/subjects.rs"

[[test]]
name = "identifier_forms"
path = "tests/identifier/forms.rs"

[[test]]
name = "public_review"
path = "tests/documentation/public_contract.rs"

[[test]]
name = "documentation_regressions"
path = "tests/documentation/layout.rs"

[[test]]
name = "cpp_documentation_roles"
path = "tests/documentation/native_roles.rs"

[[test]]
name = "return_shape_contract"
path = "tests/documentation/return_shape.rs"
