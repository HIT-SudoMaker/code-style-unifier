[package]
name = "unifier"
version = "1.1.1"
edition = "2021"
license = "MIT"
description = "Semantic code style checker for agent-scale repositories"
repository = "https://github.com/HIT-SudoMaker/code-style-unifier"
readme = "README.md"

[[bin]]
name = "csu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
toml = "0.8"
tree-sitter = "0.26.9"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
unicode-width = "0.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
